<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(#{register.title})}"></head>
<body>
  <header th:replace="~{fragments :: topbar}"></header>
  <main class="narrow">
    <h1 th:text="#{register.title}">Create an account</h1>

    <form th:action="@{/register}" th:object="${form}" method="post" class="card form" novalidate>
      <label><th:block th:text="#{register.email}">Email</th:block>
        <input type="email" th:field="*{email}" autocomplete="email" required
               th:attr="aria-invalid=${#fields.hasErrors('email')}">
        <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
      </label>
      <label><th:block th:text="#{register.name}">Your name</th:block>
        <input type="text" th:field="*{displayName}" autocomplete="nickname" maxlength="60" required
               th:attr="aria-invalid=${#fields.hasErrors('displayName')}">
        <span class="hint" th:text="#{register.name.hint}">Shown to your friends.</span>
        <span class="field-error" th:if="${#fields.hasErrors('displayName')}" th:errors="*{displayName}"></span>
      </label>
      <label><th:block th:text="#{register.password}">Password</th:block>
        <input type="password" th:field="*{password}" autocomplete="new-password" minlength="10" required
               th:attr="aria-invalid=${#fields.hasErrors('password') or #fields.hasErrors('passwordShortEnough')}">
        <span class="hint" th:text="#{register.password.hint}">At least 10 characters.</span>
        <span class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
        <span class="field-error" th:if="${#fields.hasErrors('passwordShortEnough')}" th:errors="*{passwordShortEnough}"></span>
      </label>
      <label><th:block th:text="#{register.confirm}">Repeat password</th:block>
        <input type="password" th:field="*{confirmPassword}" autocomplete="new-password" required
               th:attr="aria-invalid=${#fields.hasErrors('passwordConfirmed')}">
        <span class="field-error" th:if="${#fields.hasErrors('passwordConfirmed')}" th:errors="*{passwordConfirmed}"></span>
      </label>
      <button type="submit" class="button" th:text="#{register.submit}">Create account</button>
    </form>
    <p><th:block th:text="#{register.haveAccount}">Already have an account?</th:block> <a th:href="@{/login}" th:text="#{register.login}">Log in</a></p>
  </main>
  <footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
