<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(#{forgot.title})}"></head>
<body>
  <header th:replace="~{fragments :: topbar}"></header>
  <main class="narrow">
    <p class="breadcrumb"><a th:href="@{/login}" th:text="#{login.title}">Log in</a></p>
    <h1 th:text="#{forgot.title}">Forgot your password?</h1>
    <p class="lead" th:text="#{forgot.lead(${validMinutes})}">
      Enter the email you signed up with. We'll send you a link to choose a new password.
    </p>

    <form th:action="@{/forgot-password}" method="post" class="card form" novalidate>
      <label><th:block th:text="#{forgot.email}">Email</th:block>
        <input type="email" name="email" th:value="${email}" autocomplete="username" maxlength="254"
               required autofocus th:attr="aria-invalid=${emailError != null}">
        <span class="field-error" th:if="${emailError}" th:text="#{forgot.email.invalid}">Enter your email.</span>
      </label>
      <button type="submit" class="button" th:text="#{forgot.submit}">Send the link</button>
    </form>
  </main>
  <footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
