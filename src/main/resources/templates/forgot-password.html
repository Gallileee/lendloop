<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Forgot your password')}"></head>
<body>
  <header th:replace="~{fragments :: topbar}"></header>
  <main class="narrow">
    <p class="breadcrumb"><a th:href="@{/login}">Log in</a></p>
    <h1>Forgot your password?</h1>
    <p class="lead">
      Enter the email you signed up with. We'll send you a link to choose a new password.
      It works once, for <span th:text="${validMinutes}">30</span> minutes.
    </p>

    <form th:action="@{/forgot-password}" method="post" class="card form" novalidate>
      <label>Email
        <input type="email" name="email" th:value="${email}" autocomplete="username" maxlength="254"
               required autofocus th:attr="aria-invalid=${emailError != null}">
        <span class="field-error" th:if="${emailError}" th:text="${emailError}">Enter your email.</span>
      </label>
      <button type="submit" class="button">Send the link</button>
    </form>
  </main>
</body>
</html>
