<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Choose a new password')}"></head>
<body>
  <header th:replace="~{fragments :: topbar}"></header>
  <main class="narrow">
    <h1>Choose a new password</h1>

    <form th:action="@{/reset-password}" th:object="${form}" method="post" class="card form" novalidate>
      <input type="hidden" th:field="*{token}">
      <label>New password
        <input type="password" th:field="*{password}" autocomplete="new-password" minlength="10" required autofocus
               th:attr="aria-invalid=${#fields.hasErrors('password') or #fields.hasErrors('passwordShortEnough')}">
        <span class="hint">At least 10 characters. A few random words work well.</span>
        <span class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
        <span class="field-error" th:if="${#fields.hasErrors('passwordShortEnough')}" th:errors="*{passwordShortEnough}"></span>
      </label>
      <label>Repeat new password
        <input type="password" th:field="*{confirmPassword}" autocomplete="new-password" required
               th:attr="aria-invalid=${#fields.hasErrors('passwordConfirmed')}">
        <span class="field-error" th:if="${#fields.hasErrors('passwordConfirmed')}" th:errors="*{passwordConfirmed}"></span>
      </label>
      <button type="submit" class="button">Save new password</button>
    </form>
  </main>
</body>
</html>
