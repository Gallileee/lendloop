<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Check your email')}"></head>
<body>
  <header th:replace="~{fragments :: topbar}"></header>
  <main class="narrow">
    <h1>Check your email</h1>
    <!-- The same text whether or not the account exists, so this page can't be used to find out. -->
    <p class="notice" role="status">
      If there's a Lendloop account for
      <strong th:text="${sentTo} ?: 'that address'">sam@example.com</strong>,
      we've sent it a link to choose a new password.
    </p>
    <p>
      The link works once, for <span th:text="${validMinutes}">30</span> minutes. Nothing there?
      Check your spam folder, or <a th:href="@{/forgot-password}">ask for a new link</a>
      (up to 3 an hour).
    </p>
    <p><a th:href="@{/login}">Back to log in</a></p>
  </main>
</body>
</html>
