<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(#{forgot.sent.title})}"></head>
<body>
  <header th:replace="~{fragments :: topbar}"></header>
  <main class="narrow">
    <h1 th:text="#{forgot.sent.title}">Check your email</h1>
    <!-- The same text whether or not the account exists, so this page can't be used to find out. -->
    <p class="notice" role="status"><th:block th:text="#{forgot.sent.before}">If there's a Lendloop account for</th:block>
      <strong th:text="${sentTo} ?: #{forgot.sent.thatAddress}">sam@example.com</strong><th:block
        th:text="#{forgot.sent.after}">, we've sent it a link to choose a new password.</th:block>
    </p>
    <p>
      <th:block th:text="#{forgot.sent.validity(${validMinutes})}">The link works once, for 30 minutes.</th:block>
      <a th:href="@{/forgot-password}" th:text="#{forgot.sent.again}">ask for a new link</a>
      <th:block th:text="#{forgot.sent.limit}">(up to 3 an hour).</th:block>
    </p>
    <p><a th:href="@{/login}" th:text="#{forgot.sent.back}">Back to log in</a></p>
  </main>
  <footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
