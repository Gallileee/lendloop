<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${status} == 404 ? 'Not found' : 'Something went wrong')}"></head>
<body>
  <header th:replace="~{fragments :: topbar}"></header>
  <main class="narrow">
    <h1 th:text="${status} == 404 ? 'Not found' : 'Something went wrong'">Something went wrong</h1>
    <p th:if="${status} == 404">That page or item doesn't exist, or it isn't yours.</p>
    <p th:unless="${status} == 404">Please try again. If it keeps happening, the problem is on our side.</p>
    <p><a class="button" th:href="@{/items}">Back to my things</a></p>
  </main>
</body>
</html>
