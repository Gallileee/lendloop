<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(#{nav.groups})}"></head>
<body>
  <header th:replace="~{fragments :: topbar}"></header>
  <main>
    <h1 th:text="#{nav.groups}">Groups</h1>
    <p class="lead" th:text="#{groups.lead}">Friends, flatmates or a club.</p>

    <p th:if="${message}" class="notice" role="status" th:text="${message}">You left the group.</p>

    <ul th:unless="${#lists.isEmpty(memberships)}" class="group-list">
      <li th:each="m : ${memberships}">
        <a class="card group-link" th:href="@{/groups/{id}(id=${m.group.id})}">
          <span class="group-name" th:text="${m.group.name}">Flat 4B</span>
          <span th:if="${m.owner}" class="tag" th:text="#{common.owner}">Owner</span>
        </a>
      </li>
    </ul>

    <section class="card">
      <h2 th:text="${#lists.isEmpty(memberships)} ? #{groups.new.first} : #{groups.new}">New group</h2>
      <p th:if="${#lists.isEmpty(memberships)}" class="muted" th:text="#{groups.new.hint}">
        You'll get an invite link to send to your friends.
      </p>
      <form th:action="@{/groups}" th:object="${form}" method="post" class="form form-inline" novalidate>
        <label><th:block th:text="#{groups.name}">Group name</th:block>
          <input type="text" th:field="*{name}" maxlength="60" required th:placeholder="#{groups.name.placeholder}"
                 th:attr="aria-invalid=${#fields.hasErrors('name')}">
          <span class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
        </label>
        <button type="submit" class="button" th:text="#{groups.create}">Create group</button>
      </form>
    </section>
  </main>
  <footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
