<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Groups')}"></head>
<body>
  <header th:replace="~{fragments :: topbar}"></header>
  <main>
    <h1>Groups</h1>
    <p class="lead">Friends, flatmates or a club. Everyone in a group sees what the others are happy to lend.</p>

    <p th:if="${message}" class="notice" role="status" th:text="${message}">You left the group.</p>

    <ul th:unless="${#lists.isEmpty(memberships)}" class="group-list">
      <li th:each="m : ${memberships}">
        <a class="card group-link" th:href="@{/groups/{id}(id=${m.group.id})}">
          <span class="group-name" th:text="${m.group.name}">Flat 4B</span>
          <span th:if="${m.owner}" class="tag">Owner</span>
        </a>
      </li>
    </ul>

    <section class="card">
      <h2 th:text="${#lists.isEmpty(memberships)} ? 'Start your first group' : 'New group'">New group</h2>
      <p th:if="${#lists.isEmpty(memberships)}" class="muted">
        You'll get an invite link to send to your friends. Got a link from someone? Just open it.
      </p>
      <form th:action="@{/groups}" th:object="${form}" method="post" class="form form-inline" novalidate>
        <label>Group name
          <input type="text" th:field="*{name}" maxlength="60" required placeholder="e.g. Flat 4B"
                 th:attr="aria-invalid=${#fields.hasErrors('name')}">
          <span class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
        </label>
        <button type="submit" class="button">Create group</button>
      </form>
    </section>
  </main>
</body>
</html>
