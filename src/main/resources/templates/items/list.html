<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(#{nav.myThings})}"></head>
<body>
  <header th:replace="~{fragments :: topbar}"></header>
  <main>
    <div class="page-header">
      <h1 th:text="#{nav.myThings}">My things</h1>
      <a class="button" th:href="@{/items/new}" th:text="#{items.add}">Add item</a>
    </div>

    <p th:if="${message}" class="notice" role="status" th:text="${message}">Added.</p>
    <p th:if="${error}" class="alert" role="alert" th:text="${error}">It's lent out right now.</p>

    <section th:if="${#lists.isEmpty(items)}" class="card empty">
      <h2 th:text="#{items.empty.title}">Nothing here yet</h2>
      <p th:text="#{items.empty.text}">Add the things you'd lend to friends: books, tools, board games, a tent.</p>
      <a class="button" th:href="@{/items/new}" th:text="#{items.empty.add}">Add your first item</a>
    </section>

    <ul th:unless="${#lists.isEmpty(items)}" class="item-list">
      <li th:each="item : ${items}" class="card item">
        <div class="item-main">
          <h2 class="item-name" th:text="${item.name}">Catan</h2>
          <p class="item-meta">
            <span class="tag" th:text="#{${item.category.messageCode}}">Board game</span>
            <span th:if="${item.available}" class="status status-on" th:text="#{items.lendable}">Can be lent</span>
            <span th:unless="${item.available}" class="status status-off" th:text="#{items.notLending}">Not lending</span>
            <th:block th:if="${loans.isOnLoan(item.id)}" th:with="loan=${loans.activeLoan(item.id)}">
              <span class="status" th:text="#{common.lentTo(${loan.borrowerDisplayName})}">Lent to Sam</span>
              <span th:replace="~{fragments :: due(${loan}, ${today})}"></span>
            </th:block>
          </p>
          <p th:if="${item.description}" class="item-description" th:text="${item.description}">Base game.</p>
          <p th:if="${item.isbn}" class="muted" th:text="'ISBN ' + ${item.isbn}">ISBN 9780140328721</p>
        </div>
        <div class="item-actions">
          <!-- For lending in person to someone who isn't on Lendloop; app users ask from a group. -->
          <details th:unless="${loans.isOnLoan(item.id)}" class="ask">
            <summary class="button button-secondary" th:attr="aria-label=#{items.lend.label(${item.name})}"
                     th:text="#{items.lend}">Lend</summary>
            <form th:action="@{/loans/outside}" method="post" class="form ask-form">
              <input type="hidden" name="itemId" th:value="${item.id}">
              <label><th:block th:text="#{items.lend.to}">To whom</th:block>
                <span class="muted" th:text="#{items.lend.to.hint}">(someone not on Lendloop)</span>
                <input type="text" name="borrowerName" required maxlength="60" autocomplete="off"
                       list="outsider-names" th:placeholder="#{items.lend.to.placeholder}">
              </label>
              <label><th:block th:text="#{common.dueDate}">Return by</th:block>
                <input type="date" name="dueDate" required th:value="${dueDates.suggested}"
                       th:attr="min=${dueDates.min},max=${dueDates.max}">
              </label>
              <button type="submit" class="button" th:text="#{common.lendIt}">Lend it</button>
            </form>
          </details>
          <a class="button button-secondary" th:href="@{/items/{id}/edit(id=${item.id})}"
             th:attr="aria-label=#{items.edit.label(${item.name})}" th:text="#{items.edit}">Edit</a>
          <form th:action="@{/items/{id}/delete(id=${item.id})}" method="post"
                th:attr="data-confirm=#{items.delete.confirm(${item.name})}">
            <button type="submit" class="button button-danger"
                    th:attr="aria-label=#{items.delete.label(${item.name})}" th:text="#{items.delete}">Delete</button>
          </form>
        </div>
      </li>
    </ul>
    <!-- People you lent to before, offered while typing in any Lend form. -->
    <datalist id="outsider-names">
      <option th:each="name : ${outsiderNames}" th:value="${name}"></option>
    </datalist>
  </main>
  <script>
    // Ask before deleting. Without JavaScript the form still works, just without the question.
    document.querySelectorAll("form[data-confirm]").forEach((form) =>
      form.addEventListener("submit", (e) => {
        if (!confirm(form.dataset.confirm)) e.preventDefault()
      })
    )
  </script>
  <footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
