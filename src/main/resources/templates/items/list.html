<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('My things')}"></head>
<body>
  <header th:replace="~{fragments :: topbar}"></header>
  <main>
    <div class="page-header">
      <h1>My things</h1>
      <a class="button" th:href="@{/items/new}">Add item</a>
    </div>

    <p th:if="${message}" class="notice" role="status" th:text="${message}">Added.</p>

    <section th:if="${#lists.isEmpty(items)}" class="card empty">
      <h2>Nothing here yet</h2>
      <p>Add the things you'd lend to friends: books, tools, board games, a tent.</p>
      <a class="button" th:href="@{/items/new}">Add your first item</a>
    </section>

    <ul th:unless="${#lists.isEmpty(items)}" class="item-list">
      <li th:each="item : ${items}" class="card item">
        <div class="item-main">
          <h2 class="item-name" th:text="${item.name}">Catan</h2>
          <p class="item-meta">
            <span class="tag" th:text="${item.category.label}">Board game</span>
            <span th:if="${item.available}" class="status status-on">Can be lent</span>
            <span th:unless="${item.available}" class="status status-off">Not lending</span>
          </p>
          <p th:if="${item.description}" class="item-description" th:text="${item.description}">Base game.</p>
        </div>
        <div class="item-actions">
          <a class="button button-secondary" th:href="@{/items/{id}/edit(id=${item.id})}"
             th:attr="aria-label='Edit ' + ${item.name}">Edit</a>
          <form th:action="@{/items/{id}/delete(id=${item.id})}" method="post"
                th:attr="data-confirm='Delete ' + ${item.name} + '?'">
            <button type="submit" class="button button-danger"
                    th:attr="aria-label='Delete ' + ${item.name}">Delete</button>
          </form>
        </div>
      </li>
    </ul>
  </main>
  <script>
    // Ask before deleting. Without JavaScript the form still works, just without the question.
    document.querySelectorAll("form[data-confirm]").forEach((form) =>
      form.addEventListener("submit", (e) => {
        if (!confirm(form.dataset.confirm)) e.preventDefault()
      })
    )
  </script>
</body>
</html>
