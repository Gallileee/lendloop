<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(#{reset.invalid.pageTitle})}"></head>
<body>
  <header th:replace="~{fragments :: topbar}"></header>
  <main class="narrow">
    <h1 th:text="#{reset.invalid.title}">This link doesn't work any more</h1>
    <p class="lead" th:text="#{reset.invalid.lead}">Reset links work once and only for a short time.</p>
    <p><a class="button" th:href="@{/forgot-password}" th:text="#{reset.invalid.again}">Get a new link</a></p>
  </main>
  <footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
