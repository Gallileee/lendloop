<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Link expired')}"></head>
<body>
  <header th:replace="~{fragments :: topbar}"></header>
  <main class="narrow">
    <h1>This link doesn't work any more</h1>
    <p class="lead">
      Reset links work once and only for a short time, and asking for a new one turns off the
      older ones. It may also have been cut off when it was copied.
    </p>
    <p><a class="button" th:href="@{/forgot-password}">Get a new link</a></p>
  </main>
</body>
</html>
