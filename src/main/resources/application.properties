spring.application.name=lendloop

# Local default: an H2 file database in ./data, in PostgreSQL mode so the same
# Flyway migrations run here and on PostgreSQL. To use PostgreSQL instead, set
# SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD
# (see .env.example).
spring.datasource.url=jdbc:h2:file:./data/lendloop;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=

# The schema is owned by Flyway; Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.port=${PORT:8080}
server.error.include-message=never
