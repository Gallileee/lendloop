spring.application.name=lendloop

# Local default: an H2 file database in ./data, in PostgreSQL mode so the same
# Flyway migrations run here and on PostgreSQL. To use PostgreSQL instead, set
# SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD
# (see .env.example).
spring.datasource.url=jdbc:h2:file:./data/lendloop;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=

# The schema is owned by Flyway; Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.port=${PORT:8080}

# Due-date reminders (LoanReminderJob): daily at 8:00 server time; "-" turns them off.
lendloop.reminders.cron=${REMINDERS_CRON:0 0 8 * * *}
# Used for the link in emails.
lendloop.base-url=${BASE_URL:http://localhost:${server.port}}
lendloop.mail.from=${MAIL_FROM:Lendloop <no-reply@lendloop.local>}
# Emails are only sent when a mail server is set (SPRING_MAIL_HOST, SPRING_MAIL_PORT, see
# .env.example). Without one they are written to the log.
server.error.include-message=never
