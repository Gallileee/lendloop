spring.application.name=lendloop

# Tests use an in-memory H2 database (PostgreSQL mode), so they need no setup.
# PostgresMigrationTest runs the same migrations on real PostgreSQL when Docker is available.
spring.datasource.url=jdbc:h2:mem:lendloop-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Tests call LoanReminderJob.sendReminders themselves.
lendloop.reminders.cron=-
lendloop.base-url=https://lendloop.test
lendloop.mail.from=Lendloop <no-reply@lendloop.test>
lendloop.unsubscribe.secret=test-only-unsubscribe-secret-0123456789
# Tests never reach Open Library: IsbnLookupTests mocks BookLookup and OpenLibraryClientTest
# uses a mock server. The .invalid domain can't resolve, so a mistake fails instead of calling out.
lendloop.openlibrary.base-url=https://openlibrary.invalid
lendloop.openlibrary.user-agent=Lendloop-test

# Same as in main: never fall back to the JVM locale (Czech on a Czech machine) for page texts.
spring.messages.fallback-to-system-locale=false
