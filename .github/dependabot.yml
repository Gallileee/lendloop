# The actions in .github/workflows are pinned to commit SHAs with the version in a comment
# (`@<sha>  # v4`). Dependabot reads that comment and opens a PR when a new version comes out,
# updating the SHA and the comment together, so the pins don't go stale.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Europe/Prague
    groups:
      github-actions:
        patterns: ["*"]
